l_english:
 bv_join_power_bloc: "Join player Power Bloc"
 bv_join_power_bloc_desc: "This permit a easy way for a player to enter another player Power Bloc"
 bv_join_power_bloc_effects_desc: "• An agreement where one [concept_country] officially joins another [Concept('concept_country','$concept_country_possessive$')] [concept_power_bloc]"
 bv_join_power_bloc_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] joins the [TARGET_COUNTRY.GetAdjectiveNoFormatting] $concept_power_bloc$"
 bv_join_power_bloc_proposal_notification_name: "Request to join the [concept_power_bloc]"
 bv_join_power_bloc_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] wishes to join [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_notification_effects_desc: "$join_power_bloc_desc$"
 bv_join_power_bloc_proposal_accepted_name: "[concept_power_bloc] join request accepted"
 bv_join_power_bloc_proposal_accepted_desc: "[TARGET_COUNTRY.GetName] accepted our request to join the [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_declined_name: "[concept_power_bloc] join request declined"
 bv_join_power_bloc_proposal_declined_desc: "[TARGET_COUNTRY.GetName] declined our request to join the [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_third_party_accepted_name: "$join_power_bloc_proposal_declined_name$"
 bv_join_power_bloc_proposal_third_party_accepted_desc: "[TARGET_COUNTRY.GetName] accepted the request from [INITIATOR_COUNTRY.GetName] to join the [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_third_party_declined_name: "$join_power_bloc_proposal_accepted_name$"
 bv_join_power_bloc_proposal_third_party_declined_desc: "[TARGET_COUNTRY.GetName] declined the request from [INITIATOR_COUNTRY.GetName] to join the [TARGET_COUNTRY.GetPowerBloc.GetName]."

l_french:
 bv_join_power_bloc: "Rejoindre le Power Bloc d'un joueur"
 bv_join_power_bloc_desc: "Permet à un joueur de rejoindre facilement le Power Bloc d'un autre joueur"
 bv_join_power_bloc_effects_desc: "• Un accord où un [concept_country] rejoint officiellement le [Concept('concept_country','$concept_country_possessive$')] [concept_power_bloc]"
 bv_join_power_bloc_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] rejoint le $concept_power_bloc$ [TARGET_COUNTRY.GetAdjectiveNoFormatting]"
 bv_join_power_bloc_proposal_notification_name: "Demande pour rejoindre le [concept_power_bloc]"
 bv_join_power_bloc_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] souhaite rejoindre [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_notification_effects_desc: "$join_power_bloc_desc$"
 bv_join_power_bloc_proposal_accepted_name: "Demande d'adhésion au [concept_power_bloc] acceptée"
 bv_join_power_bloc_proposal_accepted_desc: "[TARGET_COUNTRY.GetName] a accepté notre demande pour rejoindre le [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_declined_name: "Demande d'adhésion au [concept_power_bloc] refusée"
 bv_join_power_bloc_proposal_declined_desc: "[TARGET_COUNTRY.GetName] a refusé notre demande pour rejoindre le [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_third_party_accepted_name: "$bv_join_power_bloc_proposal_declined_name$"
 bv_join_power_bloc_proposal_third_party_accepted_desc: "[TARGET_COUNTRY.GetName] a accepté la demande de [INITIATOR_COUNTRY.GetName] pour rejoindre le [TARGET_COUNTRY.GetPowerBloc.GetName]."
 bv_join_power_bloc_proposal_third_party_declined_name: "$bv_join_power_bloc_proposal_accepted_name$"
 bv_join_power_bloc_proposal_third_party_declined_desc: "[TARGET_COUNTRY.GetName] a refusé la demande de [INITIATOR_COUNTRY.GetName] pour rejoindre le [TARGET_COUNTRY.GetPowerBloc.GetName]."
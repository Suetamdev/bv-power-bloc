l_german:
 bv_join_power_bloc: "Dem Power Bloc eines Spielers beitreten"
 bv_join_power_bloc_desc: "Ermöglicht es einem Spieler, auf einfache Weise dem Power Bloc eines anderen Spielers beizutreten"
 bv_join_power_bloc_effects_desc: "• Ein Abkommen, bei dem ein [concept_country] offiziell dem [Concept('concept_country','$concept_country_possessive$')] [concept_power_bloc] beitritt"
 bv_join_power_bloc_article_short_desc: "[SOURCE_COUNTRY.GetNameNoFormatting] tritt dem $concept_power_bloc$ [TARGET_COUNTRY.GetAdjectiveNoFormatting] bei"
 bv_join_power_bloc_proposal_notification_name: "Anfrage, dem [concept_power_bloc] beizutreten"
 bv_join_power_bloc_proposal_notification_desc: "[INITIATOR_COUNTRY.GetName] möchte dem [TARGET_COUNTRY.GetPowerBloc.GetName] beitreten."
 bv_join_power_bloc_proposal_notification_effects_desc: "$join_power_bloc_desc$"
 bv_join_power_bloc_proposal_accepted_name: "Anfrage zum Beitritt zum [concept_power_bloc] akzeptiert"
 bv_join_power_bloc_proposal_accepted_desc: "[TARGET_COUNTRY.GetName] hat unsere Anfrage, dem [TARGET_COUNTRY.GetPowerBloc.GetName] beizutreten, akzeptiert."
 bv_join_power_bloc_proposal_declined_name: "Anfrage zum Beitritt zum [concept_power_bloc] abgelehnt"
 bv_join_power_bloc_proposal_declined_desc: "[TARGET_COUNTRY.GetName] hat unsere Anfrage abgelehnt, dem [TARGET_COUNTRY.GetPowerBloc.GetName] beizutreten."
 bv_join_power_bloc_proposal_third_party_accepted_name: "$bv_join_power_bloc_proposal_declined_name$"
 bv_join_power_bloc_proposal_third_party_accepted_desc: "[TARGET_COUNTRY.GetName] hat die Anfrage von [INITIATOR_COUNTRY.GetName] angenommen, dem [TARGET_COUNTRY.GetPowerBloc.GetName] beizutreten."
 bv_join_power_bloc_proposal_third_party_declined_name: "$bv_join_power_bloc_proposal_accepted_name$"
 bv_join_power_bloc_proposal_third_party_declined_desc: "[TARGET_COUNTRY.GetName] hat die Anfrage von [INITIATOR_COUNTRY.GetName] abgelehnt, dem [TARGET_COUNTRY.GetPowerBloc.GetName] beizutreten."